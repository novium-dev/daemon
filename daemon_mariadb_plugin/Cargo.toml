[package]
name = "daemon_mariadb_plugin"
version = "0.1.0"
edition = "2024"
authors = ["Markus Probst <markus.probst@posteo.de>"]
license = "AGPL-3.0-only"

[lints]
workspace = true

[package.metadata.deb]
name = "novium-daemon-mariadb-plugin"
depends = ["mariadb-server", "docker.io | docker-ce", "init-system-helpers"]
assets = [
    [
        "target/release/libdaemon_mariadb_plugin.so",
        "/usr/lib/mysql/plugin/libdaemon_mariadb_plugin.so",
        "755",
    ],
]
maintainer-scripts = "debian/"
section = "database"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
bollard.workspace = true
constcat = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies.tokio]
workspace = true
features = ["rt-multi-thread"]

[target.'cfg(target_os = "linux")'.dependencies.daemon_common]
workspace = true
features = ["docker"]

[build-dependencies.bindgen]
version = "0.72.1"
default-features = false
features = ["logging", "prettyplease"]
