stages:
  - check


.rust-default:
  image: rust:latest
  parallel:
  before_script:
    - rustc --version && cargo --version

.rust-build-default:
  image: rust:latest
  parallel:
  variables:
    BACKEND_DATABASE_URL: 'mysql://root@db/backend'
    DAEMON_DATABASE_URL: 'mysql://root@db/daemon'
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle_user"
  before_script:
    - rustc --version && cargo --version
    - mkdir .apt .cargo_home .gradle_user -p
    - echo "dir::cache::archives \"$(pwd)/.apt\";" >> /etc/apt/apt.conf && echo "Binary::apt::APT::Keep-Downloaded-Packages \"true\";" >> /etc/apt/apt.conf
    - apt update && apt install -y protobuf-compiler libclang-dev openjdk-17-jdk git libbtrfs-dev
    - RUSTFLAGS="-C opt-level=0" cargo install --color always --verbose sqlx-cli
    - until echo 1 > /dev/tcp/db/3306; do sleep 1; done
    - cargo sqlx database create --database-url "$DAEMON_DATABASE_URL"
    - cargo sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/server/migrations"
    - cargo sqlx database create --database-url "$BACKEND_DATABASE_URL"
    - mkdir backend_migrations && cp backend/*/migrations/* backend_migrations && cargo sqlx migrate run --database-url "$BACKEND_DATABASE_URL" --source "backend_migrations"
  services:
    - name: mariadb:latest
      alias: db

clippy:
  extends: .rust-build-default
  stage: check
  cache:
    - key: rust-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-$CI_DEFAULT_BRANCH
        - rust-cache-default
      paths:
        - .cargo_home/
        - .gradle_user/
        - target/
        - backend/minecraft/agent/.gradle/
        - backend/minecraft/agent/build/
      policy: pull-push
    - key: apt-cache-default
      paths:
        - .apt/
      policy: pull-push
  script:
    - rustup component add clippy
    - cargo clippy --color always --verbose -- -Dwarnings

fmt:
  extends: .rust-default
  stage: check
  parallel:
  script:
    - rustup component add rustfmt
    - cargo fmt --check --all --verbose

deny:
  extends: .rust-default
  stage: check
  parallel:
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
  cache:
    - key: rust-deny-cache
      paths:
        - .cargo_home/
      policy: pull-push
  script:
    - RUSTFLAGS="-C opt-level=0" cargo install cargo-deny

    - cargo deny check


