stages:
  - prepare
  - check
  - deploy

.rust-default:
  image:
    name: rust:1.89.0-alpine
    pull_policy: if-not-present
  parallel:
  interruptible: true
  variables:
    CARGO_TERM_COLOR: "always"
    RUSTFLAGS: "-C opt-level=0"

    FF_USE_FASTZIP: "true"
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
    CACHE_COMPRESSION_LEVEL: "fastest"
    FF_SCRIPT_SECTIONS: "true"
  before_script:
    - rustc --version && cargo --version
    - apk add --no-cache musl-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main

.rust-build-default:
  image:
    name: rust:1.89.0-alpine
    pull_policy: if-not-present
  parallel:
  interruptible: true
  variables:
    DAEMON_DATABASE_URL: 'mysql://root@db/daemon'
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'

    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    LLVM_CONFIG_PATH: "/tmp/llvm-config-static.sh"
    CARGO_TERM_COLOR: "always"
    RUSTFLAGS: "-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld"

    FF_USE_FASTZIP: "true"
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
    CACHE_COMPRESSION_LEVEL: "fastest"
    FF_SCRIPT_SECTIONS: "true"
  before_script:
    - rustc --version && cargo --version
    - mkdir .cargo_home -p
    - echo '#!/bin/ash' > /tmp/llvm-config-static.sh && echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-20 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-20 "$@"; fi' >> /tmp/llvm-config-static.sh && chmod +x /tmp/llvm-config-static.sh
    - apk add --no-cache libxml2-utils musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm20-static llvm20-dev clang20 clang20-static lld20 git mariadb-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - apk upgrade --no-cache gcc --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - until mariadb-admin ping --host db --user root --skip-ssl-verify-server-cert; do sleep 1; done
    - crates/sqlx-cli/bin/sqlx database create --database-url "$DAEMON_DATABASE_URL"
    - crates/sqlx-cli/bin/sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/migrations"
  services:
    - name: mariadb:latest
      alias: db
      pull_policy: if-not-present

cli_shared:
  extends: .rust-default
  stage: prepare
  cache:
    - key: rust-cache-cli
      paths:
        - crates/sqlx-cli
      policy: pull-push
  artifacts:
    paths:
      - crates/sqlx-cli/bin
    expire_in: 1 week
  script:
    - mkdir crates/sqlx-cli -p
    - cargo install --color always --verbose --no-default-features --features mysql,rustls sqlx-cli --root crates/sqlx-cli
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

clippy:
  extends: .rust-build-default
  stage: check
  needs: ["cli_shared"]
  cache:
    - key: rust-cache-clippy-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-clippy-$CI_DEFAULT_BRANCH
        - rust-cache-clippy-default
      paths:
        - .cargo_home/
        - target/
        - crates/gitlab_clippy
      policy: pull-push
  script:
    - mkdir crates/gitlab_clippy -p
    - rustup component add clippy
    - cargo install --color always --verbose gitlab_clippy --root crates/gitlab_clippy
    - cargo clippy --color always --verbose --no-default-features --features ci --no-deps --message-format=json | crates/gitlab_clippy/bin/gitlab-clippy > gl-code-quality-report.json
  artifacts:
    reports:
      codequality:
      - gl-code-quality-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

fmt:
  extends: .rust-default
  stage: check
  needs: []
  script:
    - rustup component add rustfmt
    - cargo fmt --check --all --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

deny:
  extends: .rust-default
  stage: check
  needs: []
  cache:
    - key: rust-cache-cargo-deny-default
      paths:
        - crates/cargo-deny
      policy: pull-push
  script:
    - mkdir crates/cargo-deny -p
    - cargo install --color always --verbose cargo-deny --root crates/cargo-deny
    - crates/cargo-deny/bin/cargo-deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

test:
  extends: .rust-build-default
  stage: check
  cache:
    - key: rust-cache-test-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-test-$CI_DEFAULT_BRANCH
        - rust-cache-test-default
      paths:
        - .cargo_home/
        - target/
      policy: pull-push
    - key: rust-cargo2junit-default
      paths:
        - crates/cargo2junit
      policy: pull-push
  needs: ["cli_shared"]
  script:
    - mkdir crates/cargo2junit -p
    - cargo install --color always --verbose cargo2junit --root crates/cargo2junit
    - curl -L https://github.com/mozilla/grcov/releases/latest/download/grcov-x86_64-unknown-linux-musl.tar.bz2 | tar jxf -
    - RUSTC_BOOTSTRAP=1 RUSTFLAGS="$RUSTFLAGS -C instrument-coverage" LLVM_PROFILE_FILE="coverage.profraw" cargo test --color always --verbose --target x86_64-unknown-linux-musl --no-default-features --features ci -- -Zunstable-options --format json --report-time | crates/cargo2junit/bin/cargo2junit > report.xml
    - ./grcov . --llvm-path /usr/lib/llvm20/bin/ --binary-path ./target/debug/ -s . -t cobertura --branch --ignore-not-existing --ignore "*cargo*" -o coverage.xml
    - xmllint --xpath "concat('Coverage - ', 100 * string(//coverage/@line-rate), '%')" coverage.xml
  coverage: '/Coverage - \d+(?:\.\d+)?/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success
  artifacts:
    when: always
    reports:
      junit:
        - report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

deploy_default:
  stage: deploy
  image:
    name: docker:28.4.0
    pull_policy: if-not-present
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  parallel:
  needs: ["clippy", "deny", "test", "fmt"]
  dependencies: []
  before_script:
    - docker info
  script:
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA --tag $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "prod" && $CI_COMMIT_REF_PROTECTED == "true"
      when: on_success
    - when: never
