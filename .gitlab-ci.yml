stages:
  - prepare
  - check


.rust-default:
  image: rust:latest
  parallel:
  before_script:
    - rustc --version && cargo --version
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

.rust-build-default:
  image: rust:latest
  parallel:
  variables:
    BACKEND_DATABASE_URL: 'mysql://root@db/backend'
    DAEMON_DATABASE_URL: 'mysql://root@db/daemon'
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
  before_script:
    - rustc --version && cargo --version
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall sqlx-cli
# - until echo 1 > /dev/tcp/db/3306; do sleep 1; done
    - cargo sqlx database create --database-url "$DAEMON_DATABASE_URL"
    - cargo sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/server/migrations"
    - cargo sqlx database create --database-url "$BACKEND_DATABASE_URL"
    - mkdir backend_migrations && cp backend/*/migrations/* backend_migrations && cargo sqlx migrate run --database-url "$BACKEND_DATABASE_URL" --source "backend_migrations"
  services:
    - name: mariadb:latest
      alias: db

clippy:
    extends: .rust-build-default
    stage: check
    script:
      - rustup component add clippy
      - cargo binstall gitlab-report
      - 'cargo clippy
          --color always
          --verbose
          --message-format=json
          | gitlab-report -p clippy > gl-code-quality-report.json'
    artifacts:
      when: always
      reports:
        codequality: gl-code-quality-report.json

fmt:
  extends: .rust-default
  stage: check
  parallel:
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check --verbose

deny:
  extends: .rust-default
  stage: check
  parallel:
  script:
    - cargo binstall cargo-deny
    - cargo deny check


