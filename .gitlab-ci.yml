stages:
  - check


.rust-default:
  image: rust:alpine
  parallel:
  before_script:
    - rustc --version && cargo --version
    - apk add --no-cache musl-dev llvm20 clang20 lld20 --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main

.rust-build-default:
  image: rust:alpine
  parallel:
  variables:
    DAEMON_DATABASE_URL: 'mysql://root@db/daemon'
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle_user"
    LLVM_CONFIG_PATH: "/tmp/llvm-config-static.sh"
  before_script:
    - rustc --version && cargo --version
    - mkdir .cargo_home .gradle_user -p
    - echo '#!/bin/ash' > /llvm-config-static.sh && echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-20 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-20 "$@"; fi' >> /llvm-config-static.sh && chmod +x /llvm-config-static.sh
    - apk add --no-cache musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm20-static llvm20-dev clang20 clang20-static lld20 git openjdk21-jdk protoc mariadb-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - RUSTFLAGS="-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld" cargo install --color always --verbose --no-default-features --features mysql,rustls sqlx-cli
    - until mariadb-admin ping --host db --user root --skip-ssl-verify-server-cert; do sleep 1; done
    - cargo sqlx database create --database-url "$DAEMON_DATABASE_URL"
    - cargo sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/migrations"
  services:
    - name: mariadb:latest
      alias: db

clippy:
  extends: .rust-build-default
  stage: check
  cache:
    - key: rust-clippy-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-clippy-cache-$CI_DEFAULT_BRANCH
        - rust-clippy-cache-default
      paths:
        - .cargo_home/
        - .gradle_user/
        - target/
      policy: pull-push
  script:
    - rustup component add clippy
    - RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld" cargo clippy --color always --verbose --no-default-features --features ci -- -Dwarnings

fmt:
  extends: .rust-default
  stage: check
  parallel:
  script:
    - rustup component add rustfmt
    - cargo fmt --check --all --verbose

deny:
  extends: .rust-default
  stage: check
  parallel:
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
  cache:
    - key: rust-deny-cache
      paths:
        - .cargo_home/
      policy: pull-push
  script:
    - RUSTFLAGS="-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld" cargo install --color always --verbose cargo-deny

    - cargo deny check


