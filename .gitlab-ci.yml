stages:
  - prepare
  - check
  - test


.rust-default:
  image: lukemathwalker/cargo-chef:latest-rust-1-alpine
  parallel:
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle_user"
    LLVM_CONFIG_PATH: "/tmp/llvm-config-static.sh"
    CARGO_TERM_COLOR: "always"
  before_script:
    - rustc --version && cargo --version
    - mkdir .cargo_home .gradle_user -p
    - echo '#!/bin/ash' > /tmp/llvm-config-static.sh && echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-20 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-20 "$@"; fi' >> /tmp/llvm-config-static.sh && chmod +x /tmp/llvm-config-static.sh
    - apk add --no-cache musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm20-static llvm20-dev clang20 clang20-static lld20 git curl --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main

.rust-build-default:
  image: lukemathwalker/cargo-chef:latest-rust-1-alpine
  parallel:
  variables:
    DAEMON_DATABASE_URL: 'mysql://root@db/daemon'
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle_user"
    LLVM_CONFIG_PATH: "/tmp/llvm-config-static.sh"
    CARGO_TERM_COLOR: "always"
  before_script:
    - rustc --version && cargo --version
    - mkdir .cargo_home .gradle_user -p
    - echo '#!/bin/ash' > /tmp/llvm-config-static.sh && echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-20 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-20 "$@"; fi' >> /tmp/llvm-config-static.sh && chmod +x /tmp/llvm-config-static.sh
    - apk add --no-cache musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm20-static llvm20-dev clang20 clang20-static lld20 git openjdk21-jdk protoc mariadb-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - RUSTFLAGS="-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld" cargo install --color always --verbose --no-default-features --features mysql,rustls sqlx-cli
    - until mariadb-admin ping --host db --user root --skip-ssl-verify-server-cert; do sleep 1; done
    - cargo sqlx database create --database-url "$DAEMON_DATABASE_URL"
    - cargo sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/migrations"
  services:
    - name: mariadb:latest
      alias: db

prepare:
  extends: .rust-default
  stage: prepare
  cache:
    - key: rust-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-$CI_DEFAULT_BRANCH
        - rust-cache-default
      paths:
        - .cargo_home/
        - target/
      policy: pull-push
  artifacts:
    paths:
      - .cargo_home/
      - target/
  script:
    - cargo chef prepare --recipe-path recipe.json
    - cargo chef cook --recipe-path recipe.json --no-default-features --features ci --verbose --workspace --target x86_64-unknown-linux-musl
  after_script:
    - du -sh .cargo_home target/

clippy:
  extends: .rust-build-default
  stage: check
  needs: ["prepare"]
  script:
    - rustup component add clippy
    - RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld" cargo clippy --color always --verbose --no-default-features --features ci

fmt:
  extends: .rust-default
  stage: check
  parallel:
  script:
    - rustup component add rustfmt
    - cargo fmt --check --all --verbose

deny:
  extends: .rust-default
  stage: check
  parallel:
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
  cache:
    - key: rust-deny-cache
      paths:
        - .cargo_home/
      policy: pull-push
  script:
    - RUSTFLAGS="-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld" cargo install --color always --verbose cargo-deny

    - cargo deny check

test:
  extends: .rust-build-default
  stage: test
  needs: ["prepare"]
  script:
    - cargo install cargo2junit
    - cargo test -- -Z unstable-options --format json --report-time | cargo2junit > report.xml
  artifacts:
    when: always
    reports:
      junit:
        - report.xml
