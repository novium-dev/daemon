stages:
  - prepare
  - check
  - test


.rust-default:
  image: lukemathwalker/cargo-chef:latest-rust-1-alpine
  parallel:
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    LLVM_CONFIG_PATH: "/tmp/llvm-config-static.sh"
    CARGO_TERM_COLOR: "always"
    RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    RUSTC_BOOTSTRAP: "1"
  before_script:
    - rustc --version && cargo --version
    - mkdir .cargo_home -p
    - echo '#!/bin/ash' > /tmp/llvm-config-static.sh && echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-20 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-20 "$@"; fi' >> /tmp/llvm-config-static.sh && chmod +x /tmp/llvm-config-static.sh
    - apk add --no-cache musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm20-static llvm20-dev clang20 clang20-static lld20 git curl --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main

.rust-build-default:
  image: lukemathwalker/cargo-chef:latest-rust-1-alpine
  parallel:
  variables:
    DAEMON_DATABASE_URL: 'mysql://root@db/daemon'
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'

    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    LLVM_CONFIG_PATH: "/tmp/llvm-config-static.sh"
    CARGO_TERM_COLOR: "always"
    RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    RUSTC_BOOTSTRAP: "1"
  before_script:
    - rustc --version && cargo --version
    - mkdir .cargo_home -p
    - echo '#!/bin/ash' > /tmp/llvm-config-static.sh && echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-20 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-20 "$@"; fi' >> /tmp/llvm-config-static.sh && chmod +x /tmp/llvm-config-static.sh
    - apk add --no-cache musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm20-static llvm20-dev clang20 clang20-static lld20 git mariadb-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - apk upgrade --no-cache gcc --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - until mariadb-admin ping --host db --user root --skip-ssl-verify-server-cert; do sleep 1; done
    - crates/sqlx-cli/bin/sqlx database create --database-url "$DAEMON_DATABASE_URL"
    - crates/sqlx-cli/bin/sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/migrations"
  services:
    - name: mariadb:latest
      alias: db

crate_dependencies:
  extends: .rust-default
  stage: prepare
  cache:
    - key: rust-cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-$CI_DEFAULT_BRANCH
        - rust-cache-default
      paths:
        - .cargo_home/
        - target/
      policy: pull-push
  artifacts:
    paths:
      - .cargo_home/
      - target/
  script:
    - cargo chef prepare --recipe-path recipe.json
    - cargo chef cook --recipe-path recipe.json --no-default-features --features ci --verbose --workspace --target x86_64-unknown-linux-musl -Zunstable-options
  after_script:
    - du -sh .cargo_home target/

cli_sqlx:
  extends: .rust-default
  stage: prepare
  cache:
    - key: rust-cache-sqlx-cli-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-sqlx-cli-$CI_DEFAULT_BRANCH
        - rust-cache-sqlx-cli-default
      paths:
        - .cargo_home/
        - crates/sqlx-cli
      policy: pull-push
  artifacts:
    paths:
      - crates/sqlx-cli/bin
  script:
    - mkdir crates/sqlx-cli -p
    - RUSTFLAGS="-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld" cargo install --color always --verbose --no-default-features --features mysql,rustls sqlx-cli --root crates/sqlx-cli

cli_cargo2junit:
  extends: .rust-default
  stage: prepare
  cache:
    - key: rust-cache-cargo2junit-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-cargo2junit-$CI_DEFAULT_BRANCH
        - rust-cache-cargo2junit-default
      paths:
        - .cargo_home/
        - crates/cargo2junit
      policy: pull-push
  artifacts:
    paths:
      - crates/cargo2junit/bin
  script:
    - mkdir crates/cargo2junit -p
    - RUSTFLAGS="-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld" cargo install --color always --verbose cargo2junit --root crates/cargo2junit

cli_deny:
  extends: .rust-default
  stage: prepare
  cache:
    - key: rust-cache-cargo-deny-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-cargo-deny-$CI_DEFAULT_BRANCH
        - rust-cache-cargo-deny-default
      paths:
        - .cargo_home/
        - crates/cargo-deny
      policy: pull-push
  artifacts:
    paths:
      - crates/cargo-deny/bin
  script:
    - mkdir crates/cargo-deny -p
    - RUSTFLAGS="-C opt-level=0 -C linker=clang -C link-arg=-fuse-ld=lld" cargo install --color always --verbose cargo-deny --root crates/cargo-deny

clippy:
  extends: .rust-build-default
  stage: check
  needs: ["crate_dependencies", "cli_sqlx"]
  script:
    - rustup component add clippy
    - cargo clippy --color always --verbose --no-default-features --features ci --no-deps -Zunstable-options

fmt:
  extends: .rust-default
  stage: check
  needs: []
  script:
    - rustup component add rustfmt
    - cargo fmt --check --all --verbose

deny:
  extends: .rust-default
  stage: check
  needs: ["cli_deny"]
  script:
    - crates/cargo-deny/bin/cargo-deny check

test:
  extends: .rust-build-default
  stage: test
  needs: ["crate_dependencies", "cli_sqlx", "cli_cargo2junit"]
  script:
    - cargo test --color always --verbose --target x86_64-unknown-linux-musl --no-default-features --features ci --message-format json -Zunstable-options -- --report-time | crates/cargo2junit/bin/cargo2junit > report.xml
  artifacts:
    when: always
    reports:
      junit:
        - report.xml
