name: ci

on:
  push:
    branches: [dev, prod]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Incremental artifacts are useless in CI and bloat the cache
  CARGO_INCREMENTAL: "0"
  # Skip debuginfo: faster builds, smaller cache (coverage does not need it)
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_DENY_VERSION: "0.20.2"
  GRCOV_VERSION: "v0.10.8"
  SQLX_CLI_VERSION: "0.9.0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.0-alpine
    steps:
      - run: apk add --no-cache nodejs git
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --check --all

  deny:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.0-alpine
    steps:
      - run: apk add --no-cache nodejs git curl
      - uses: actions/checkout@v4
      - name: Install cargo-deny (prebuilt)
        run: |
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo-deny check

  clippy:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.0-alpine
    services:
      clippy-db:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    env:
      DAEMON_DATABASE_URL: "mysql://root@clippy-db/daemon"
      CARGO_HOME: ${{ github.workspace }}/.cargo_home
      LLVM_CONFIG_PATH: /tmp/llvm-config-static.sh
      RUSTFLAGS: "-C opt-level=0 -C linker=clang-22 -C link-arg=-fuse-ld=lld"
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache nodejs musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm22-static llvm22-dev clang22 clang22-static lld22 git mariadb-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
          echo '#!/bin/ash' > /tmp/llvm-config-static.sh
          echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-22 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-22 "$@"; fi' >> /tmp/llvm-config-static.sh
          chmod +x /tmp/llvm-config-static.sh
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: crates/sqlx-cli
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            .cargo_home/registry/index/
            .cargo_home/registry/cache/
            .cargo_home/git/db/
            target/
          key: rust-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-clippy-
      - name: Set up database
        run: |
          [ -x crates/sqlx-cli/bin/sqlx ] || RUSTFLAGS="-C opt-level=0" cargo install --locked --version "$SQLX_CLI_VERSION" --no-default-features --features mysql,rustls sqlx-cli --root crates/sqlx-cli
          until mariadb-admin ping --host clippy-db --user root --skip-ssl-verify-server-cert; do sleep 1; done
          crates/sqlx-cli/bin/sqlx database create --database-url "$DAEMON_DATABASE_URL"
          crates/sqlx-cli/bin/sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/migrations"
      - run: rustup component add clippy
      - run: cargo clippy --no-default-features --features ci --no-deps

  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.0-alpine
    services:
      test-db:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    env:
      DAEMON_DATABASE_URL: "mysql://root@test-db/daemon"
      CARGO_HOME: ${{ github.workspace }}/.cargo_home
      LLVM_CONFIG_PATH: /tmp/llvm-config-static.sh
      RUSTFLAGS: "-C opt-level=0 -C linker=clang-22 -C link-arg=-fuse-ld=lld -C instrument-coverage"
      RUSTC_BOOTSTRAP: "1"
      # One file per process/binary, otherwise test binaries overwrite each other
      LLVM_PROFILE_FILE: ${{ github.workspace }}/profraw/%p-%m.profraw
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache nodejs libxml2-utils musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm22-static llvm22-dev clang22 clang22-static lld22 git mariadb-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
          echo '#!/bin/ash' > /tmp/llvm-config-static.sh
          echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-22 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-22 "$@"; fi' >> /tmp/llvm-config-static.sh
          chmod +x /tmp/llvm-config-static.sh
          curl -sSfL "https://github.com/mozilla/grcov/releases/download/${GRCOV_VERSION}/grcov-x86_64-unknown-linux-musl.tar.bz2" | tar jx -C /usr/local/bin
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: crates/sqlx-cli
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            .cargo_home/registry/index/
            .cargo_home/registry/cache/
            .cargo_home/git/db/
            target/
          key: rust-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-test-
      - name: Set up database
        run: |
          [ -x crates/sqlx-cli/bin/sqlx ] || RUSTFLAGS="-C opt-level=0" cargo install --locked --version "$SQLX_CLI_VERSION" --no-default-features --features mysql,rustls sqlx-cli --root crates/sqlx-cli
          until mariadb-admin ping --host test-db --user root --skip-ssl-verify-server-cert; do sleep 1; done
          crates/sqlx-cli/bin/sqlx database create --database-url "$DAEMON_DATABASE_URL"
          crates/sqlx-cli/bin/sqlx migrate run --database-url "$DAEMON_DATABASE_URL" --source "daemon/migrations"
      # --target keeps instrument-coverage away from build scripts and proc macros
      - run: cargo test --target x86_64-unknown-linux-musl --no-default-features --features ci
      - name: Coverage
        run: |
          grcov profraw --llvm-path /usr/lib/llvm22/bin/ --binary-path ./target/x86_64-unknown-linux-musl/debug/ -s . -t cobertura --branch --ignore-not-existing --ignore "*cargo*" -o coverage.xml
          xmllint --xpath "concat('Coverage - ', 100 * string(//coverage/@line-rate), '%')" coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  deploy_daemon:
    # Auto deploy on push to prod, manual deploy from dev via workflow_dispatch
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/prod') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    needs: [clippy, deny, test, fmt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        run: |
          REGISTRY="ghcr.io"
          IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-8)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          # docker-container driver can export the cache of all stages (inline cache only covers the final one).
          # The builder persists on the host, so its local layer cache is reused across runs too.
          docker buildx inspect ci-builder >/dev/null 2>&1 || docker buildx create --name ci-builder --driver docker-container
          docker buildx use ci-builder
          docker buildx build \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
            --tag "$IMAGE:$SHORT_SHA" --tag "$IMAGE:latest" \
            --push .
