[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl"
]
all-features = true

[bans]
# We want to keep the dependency tree as slim as possible. Let's
# warn when we're shipping multiple versions of the same crate.
multiple-versions = "warn"

deny = [
  # We want rustls
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-git = [
  "https://github.com/0xIO32/zelus.git",
  "https://github.com/0xIO32/reqwest.git",
  "https://github.com/novium-dev/zelus_keys.git",
  "https://github.com/rustls/hyper-rustls.git?rev=5e9b69b4128abfc147e8b6fa55977eac4c3f575c",
  "https://github.com/acatton/serde-yaml-ng.git?rev=3628102977f3ec9e02b95ef32fcec30b3df91390",
  "https://github.com/fussybeaver/bollard.git?rev=dca659509a12544cabe418c7832f1ac741c88d2c",
]

[licenses]
unused-allowed-license = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "CC0-1.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "AGPL-3.0-only",
  "CDLA-Permissive-2.0",

  "bzip2-1.0.6" # No osi approvel yet?
]

[advisories]
unmaintained = "workspace"
ignore = [
    "RUSTSEC-2023-0071", # TODO: Marvin side-channel attack on rsa@0.9.8
]
