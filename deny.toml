[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl"
]
all-features = true

[bans]
# We want to keep the dependency tree as slim as possible. Let's
# warn when we're shipping multiple versions of the same crate.
multiple-versions = "warn"

deny = [
    # We want rustls
    { name = "openssl-sys" },
    
    # We want ring
    { name = "aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-git = [
  "https://github.com/MarkusTieger/tonic.git"
]

[licenses]
unused-allowed-license = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "CC0-1.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "AGPL-3.0"
  "CDLA-Permissive-2.0"
]

[licenses.private]
ignore = true

[advisories]
unmaintained = "workspace"
ignore = [
    "RUSTSEC-2023-0071", # Marvin side-channel attack on rsa@0.9.8
    "RUSTSEC-2024-0436"
]

