[package]
name = "daemon_common"
version = "0.1.0"
edition = "2024"
authors = ["Markus Probst <markus.probst@posteo.de>"]
license = "AGPL-3.0-only"

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
ssh = ["backend", "dep:serde"]
docker = [
    "dep:bollard",
    "dep:tokio",
    "tokio/fs",
    "dep:lazy-regex"
]
keys = [
    "dep:ed25519-dalek",
    "dep:x509-parser",
    "dep:thiserror",
    "dep:pem",
    "dep:rustls-pemfile",
    "dep:rustls",
    "dep:time",
    "dep:rcgen",
    "dep:rand",
    "dep:pkcs8",
]
service = [
    "dep:zelus",
    "dep:cron",
    "dep:chrono-tz",
    "dep:ed25519-dalek",
    "dep:serde_json",
    "dep:tokio",
    "dep:serde_yaml_ng",
    "dep:axum",
    "dep:serde",
    "dep:crc64",
    "dep:java-properties",
    "dep:utoipa",
    "dep:chrono",
    "dep:tracing",
    "dep:base64",
    "tokio/io-util",
    "tokio/rt",
    "tokio/fs",
    "dep:tokio-util",
    "tokio-util/io-util",
]
backend = ["dep:serde"]
sdk = [
    "service",
    "keys",
    "dep:reqwest",
    "dep:either",
    "dep:http"
]
default = ["service", "keys", "backend"]
ci = ["default"]

[dependencies]
bitflags.workspace = true
url.workspace = true
uuid.workspace = true

[dependencies.zelus]
workspace = true
optional = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.pkcs8]
workspace = true
optional = true

[dependencies.x509-parser]
version = "0.18.0"
optional = true

[dependencies.asn1-rs]
version = "0.7.1"

[dependencies.bollard]
workspace = true
optional = true

[dependencies.ed25519-dalek]
workspace = true
optional = true

[dependencies.cron]
workspace = true
optional = true

[dependencies.chrono-tz]
workspace = true
optional = true

[dependencies.axum]
workspace = true
features = ["ws"]
optional = true

[dependencies.serde_json]
workspace = true
optional = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.tokio]
workspace = true
optional = true

[dependencies.serde_yaml_ng]
workspace = true
optional = true

[dependencies.rcgen]
workspace = true
optional = true

[dependencies.thiserror]
workspace = true
optional = true

[dependencies.crc64]
