[package]
name = "daemon_common"
version = "0.1.0"
edition = "2024"
authors = ["Markus Probst <markus.probst@posteo.de>"]
license = "AGPL-3.0-only"

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
ssh = ["backend", "dep:serde"]
docker = ["dep:bollard", "dep:tokio", "tokio/fs", "dep:lazy-regex"]
keys = ["dep:zelus_keys", "dep:ed25519-dalek", "dep:rustls"]
service = [
    "dep:zelus",
    "dep:cron",
    "dep:chrono-tz",
    "dep:ed25519-dalek",
    "dep:serde_json",
    "dep:tokio",
    "dep:serde_yaml_ng",
    "dep:toml",
    "dep:xmltree",
    "dep:axum",
    "dep:serde",
    "dep:crc64",
    "dep:java-properties",
    "dep:ini",
    "dep:utoipa",
    "dep:utoipa-axum",
    "dep:sha2",
    "dep:chrono",
    "dep:tracing",
    "dep:base64",
    "tokio/io-util",
    "tokio/rt",
    "tokio/fs",
    "dep:tokio-util",
    "tokio-util/io-util",
]
backend = ["dep:serde"]
databases = ["service"]
sdk = ["service", "keys", "dep:reqwest", "dep:either", "dep:http"]
default = ["service", "keys", "backend", "databases"]
ci = ["service", "keys", "backend"]

[dependencies]
bitflags.workspace = true
url.workspace = true
uuid.workspace = true

[dependencies.zelus_keys]
workspace = true
optional = true

