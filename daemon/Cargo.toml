[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[features]
ssl = []
ssh = ["russh", "russh-keys", "reqwest"]
ssh_debug_auth_bypass = ["ssh"]
sftp = ["ssh", "russh-sftp"]
files = ["daemon_common/files"]
backups = ["async-compression"]
database = ["daemon_common/database"]
websocket = ["axum/ws", "daemon_common/websocket"]
websocket_debug_auth_bypass = ["websocket"]

btrfs = ["btrfsutil"]
default = ["ssl", "ssh", "sftp", "websocket", "database", "files", "backups", "btrfs"]

[dependencies]
libc.workspace = true
bollard.workspace = true
bitflags.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
rustls.workspace = true
axum-macros.workspace = true
axum-auth.workspace = true
axum-server.workspace = true
axum.workspace = true
tower-http.workspace = true
tower-layer.workspace = true
base64.workspace = true
diesel.workspace = true
diesel-async.workspace = true
log.workspace = true
uuid.workspace = true
regex.workspace = true
rand.workspace = true
env_logger.workspace = true
signal-hook.workspace = true
openssl.workspace = true
termion.workspace = true
pkcs8.workspace = true
ed25519-dalek.workspace = true

futures-util = "0.3.30"
futures = "0.3.30"
bytes = "1.7.2"
tokio-util = "0.7.12"

[dependencies.daemon_common]
workspace = true
features = ["docker"]

[dependencies.tokio-tar]
version = "0.3.1"

[dependencies.async-compression]
version = "0.4.14"
features = ["all"]
optional = true

[dependencies.reqwest]
workspace = true
optional = true

[dependencies.btrfsutil]
version = "0.2.0"
optional = true

[dependencies.russh]
version = "0.46.0-beta.4"
features = ["openssl"]
optional = true

[dependencies.russh-sftp]
version = "2.0.5"
optional = true

[dependencies.russh-keys]
version = "0.46.0-beta.3"
features = ["openssl"]
optional = true
