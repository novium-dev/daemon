[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.128"
regex = "1.10.6"

futures-util = "0.3.30"
env_logger = "0.11.5"
rand = "0.8.5"
libc = "0.2.156"

[dependencies.tokio]
version = "1.39.2"
features = ["full"]

[dependencies.axum]
version = "0.7.5"
features = ["ws", "json"]

[dependencies.tower-http]
version = "0.5.2"
features = ["cors", "auth"]

[dependencies.tower-layer]
version = "0.3.3"

[dependencies.axum-auth]
version = "0.7.0"

[dependencies.base64]
version = "0.22.1"

[dependencies.bollard]
version = "0.17.0"

[dependencies.diesel]
version = "2.2.2"
features = ["mysql"]

[dependencies.log]
version = "0.4.22"

[dependencies.futures]
version = "0.3.30"
features = []

[dependencies.btrfsutil]
version = "0.2.0"

[dependencies.tar]
version = "0.4.41"

[dependencies.bytes]
version = "1.7.1"

[dependencies.termion]
version = "4.0.2"

[dependencies.pkcs8]
version = "0.11.0-rc.1"
features = ["pem"]

[dependencies.ed25519-dalek]
version = "2.1.1"
features = ["serde", "rand_core", "pkcs8"]

[dependencies.russh]
version = "0.46.0-beta.4"
features = ["openssl"]

[dependencies.russh-sftp]
version = "2.0.3"

[dependencies.russh-keys]
version = "0.46.0-beta.3"
features = ["openssl"]

[dependencies.uuid]
version = "1.10.0"
features = ["v4"]

[dependencies.signal-hook]
version = "0.3.17"

