[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
authors = ["Markus Probst <markus.probst@posteo.de>"]
license = "AGPL-3.0-only"

[lints]
workspace = true

[package.metadata.deb]
name = "novium-daemon"
depends = [
	"novium-daemon-mariadb-plugin",
	"adduser (>=3.40)",
	"docker.io | docker-ce",
	"vim",
	"liblzma5",
	"init-system-helpers",
]
conflicts = "novium_daemon_trace"
assets = [["target/release/daemon", "/usr/bin/novium_daemon", "755"]]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "novium_daemon", enable = false }
section = "admin"

[package.metadata.deb.variants.trace]
name = "novium-daemon-trace"
conflicts = "novium_daemon"
features = ["trace_sync"]

[features]
ssh_debug_auth_bypass = []
btrfs = []
sentry = ["dep:sentry"]
databases = ["daemon_common/databases"]

default = ["sentry", "btrfs", "databases", "bindgen/runtime"]
full = ["default"]
full_bypass = ["full", "ssh_debug_auth_bypass"]
ci = ["sentry", "btrfs", "bindgen/static"]

[dependencies]
libc.workspace = true
bollard.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rustls.workspace = true
axum-server.workspace = true
axum-extra.workspace = true
axum.workspace = true
itertools.workspace = true
tower-http.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
lazy-regex.workspace = true
rand.workspace = true
chacha20.workspace = true
signal-hook.workspace = true
termion.workspace = true
pkcs8.workspace = true
ed25519-dalek.workspace = true
chrono.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
async-trait.workspace = true
sqlx.workspace = true
hex.workspace = true
tokio-util.workspace = true
indexmap.workspace = true
futures-util.workspace = true
futures.workspace = true
clap.workspace = true
arc-swap.workspace = true
either.workspace = true
tower-layer.workspace = true
tokio-rustls.workspace = true
thiserror.workspace = true
http-body-util = "0.1.5"

sysinfo = "0.39.6"
iana-time-zone = "0.1.65"
num-traits = "0.2.19"
ringbuffer = "0.16.0"
fs_extra = "1.3.0"
xattr = "1.6.1"

bytes.workspace = true
cron.workspace = true
chrono-tz.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
capctl = "0.2.4"
procfs = "0.18.0"

[dependencies.tokio]
workspace = true
features = ["full"]

[dependencies.tokio-stream]
version = "0.1"
features = ["fs"]

[dependencies.anyhow]
version = "1.0.104"
features = ["std"]

[dependencies.sentry]
workspace = true
optional = true

[dependencies.utoipa-swagger-ui]
version = "9.0.2"
features = ["axum"]

[dependencies.cap-async-std]
version = "3.4.6"
features = ["tokio1"]

[dependencies.zelus_keys]
workspace = true
features = ["setup"]

[dependencies.daemon_common]
workspace = true
features = ["docker", "service", "ssh", "keys"]

[dependencies.tar]
version = "0.4.46"

[dependencies.reqwest]
workspace = true

[dependencies.url]
workspace = true
features = ["serde"]

[dependencies.russh]
version = "0.64.1"

[dependencies.russh-sftp]
version = "3.0.1"

[dependencies.rustix]
version = "1.1.5"
features = ["thread", "fs"]

[dependencies.zbus]
version = "5.19.0"
features = ["tokio"]

[dependencies.zbus_systemd]
version = "0.26200.0"
features = ["systemd1"]

[dependencies.nix]
version = "0.31.3"
features = ["fs", "user"]

[dependencies.zstd]
version = "0.14.2"
features = []

[dependencies.flate2]
version = "1.1.10"
features = ["zlib"]

[dependencies.bzip2]
version = "0.6.1"

[dependencies.liblzma]
version = "0.4.8"
features = []

[dependencies.lz4]
version = "1.28.1"

[dependencies.zip]
version = "9.0.3"
default-features = false
features = ["deflate-flate2", "deflate64", "bzip2", "zstd"]

[build-dependencies.bindgen]
version = "0.72.1"
default-features = false
features = ["logging", "prettyplease"]
