[package]
name = "daemon"
version = "0.1.0"
edition = "2021"
authors = ["MarkusTieger"]
license = "AGPL-3.0-only"

[package.metadata.deb]
name = "novium_daemon"
depends = ["novium_daemon_mariadb_plugin", "adduser>=3.40", "docker.io | docker-ce"]
assets = [["target/release/daemon", "/usr/bin/novium_daemon", "755"]]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "novium_daemon", enable = false }

[features]
ssl = []
ssh = ["russh", "russh-keys", "daemon_common/ssh"]
ssh_control = ["ssh"]
ssh_debug_auth_bypass = ["ssh"]
sftp = ["ssh", "russh-sftp"]
database = ["daemon_common/database"]
user_debug_auth_bypass = ["user"]
btrfs = ["daemon_common/btrfs", "libbtrfs"]
user = ["axum/ws", "daemon_common/user"]
sentry = ["dep:sentry"]

default = ["ssl", "ssh", "sftp", "ssh_control", "database", "user", "sentry", "btrfs"]
full = ["default"]
full_bypass = ["full", "ssh_debug_auth_bypass", "user_debug_auth_bypass"]

[dependencies]
libc.workspace = true
bollard.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
rustls.workspace = true
axum-server.workspace = true
axum.workspace = true
tower-http.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
regex.workspace = true
rand.workspace = true
signal-hook.workspace = true
termion.workspace = true
pkcs8.workspace = true
ed25519-dalek.workspace = true
chrono.workspace = true
utoipa.workspace = true
async-trait.workspace = true
sqlx.workspace = true
hex.workspace = true
bytes.workspace = true
tokio-util.workspace = true
serde_yaml.workspace = true

indexmap = "2.7.1"
futures-util = "0.3.31"
futures = "0.3.31"
sysinfo = "0.33.1"
inquire = "0.7.5"
num-traits = "0.2.19"
ringbuffer = "0.15.0"
utoipa-axum = "0.2.0"

[dependencies.anyhow]
version = "1.0.95"
features = ["std"]

[dependencies.sentry]
workspace = true
optional = true

[dependencies.utoipa-swagger-ui]
version = "9.0.0"
features = ["axum"]

[dependencies.cap-async-std]
version = "3.4.2"
features = ["tokio1"]

[dependencies.async-std]
version = "1.13.0"
features = ["tokio1"]

[dependencies.daemon_common]
workspace = true
features = ["docker"]

[dependencies.tokio-tar]
version = "0.3.1"

[dependencies.async-compression]
version = "0.4.18"
features = ["all"]

[dependencies.reqwest]
workspace = true

[dependencies.libbtrfs]
version = "0.0.12"
optional = true

[dependencies.russh]
version = "0.50.0-beta.10"
optional = true

[dependencies.russh-sftp]
version = "2.0.6"
optional = true

[dependencies.russh-keys]
version = "0.50.0-beta.7"
optional = true

[dependencies.ratatui]
version = "0.29.0"
features = ["crossterm"]

[dependencies.crossterm]
version = "0.28.1"
features = ["event-stream", "events"]
