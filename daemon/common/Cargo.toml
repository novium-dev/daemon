[package]
name = "daemon_common"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
database = []
files = []
websocket = ["axum"]
backups = []
btrfs = []
docker = ["bollard"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
bitflags.workspace = true
utoipa.workspace = true

[dependencies.bollard]
workspace = true
optional = true


[dependencies.axum]
workspace = true
features = ["ws"]
optional = true
