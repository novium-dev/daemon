[package]
name = "daemon_sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
database = ["daemon_common/database"]
user = ["ed25519-dalek", "pkcs8"]
websocket = ["user"]
files = ["daemon_common/files"]
backups = ["daemon_common/backups"]
btrfs = ["daemon_common/btrfs"]
default = ["database", "user", "files", "backups", "websocket", "btrfs"]

[dependencies]
daemon_common.workspace = true
base64.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
url = "2.5.2"
duplicate = "2.0.0"
bytes = "1.7.2"
futures-util = "0.3.31"

[dependencies.reqwest]
workspace = true
features = ["stream"]

[dependencies.ed25519-dalek]
workspace = true
optional = true

[dependencies.pkcs8]
workspace = true
optional = true
