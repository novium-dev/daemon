[package]
name = "daemon_sdk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[features]
database = []
user = ["ed25519-dalek", "pkcs8"]
btrfs = ["daemon_common/btrfs"]
default = ["database", "user", "btrfs"]

[dependencies]
daemon_common.workspace = true
base64.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
futures-core.workspace = true
url.workspace = true
bytes.workspace = true
futures-util.workspace = true

[dependencies.reqwest]
workspace = true
features = ["stream"]

[dependencies.ed25519-dalek]
workspace = true
optional = true

[dependencies.pkcs8]
workspace = true
optional = true
