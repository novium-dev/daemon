[package]
name = "daemon_mariadb_plugin"
version = "0.1.0"
edition = "2024"
authors = ["Markus Probst <markustieger@gmail.com>"]
license = "AGPL-3.0-only"

[package.metadata.deb]
name = "novium-daemon-mariadb-plugin"
depends = ["mariadb-server", "docker.io | docker-ce", "init-system-helpers"]
assets = [
    [
        "target/release/libdaemon_mariadb_plugin.so",
        "/usr/lib/mysql/plugin/libdaemon_mariadb_plugin.so",
        "755",
    ],
]
maintainer-scripts = "debian/"
section = "database"

[lib]
crate-type = ["cdylib"]

[features]
ci = []

[dependencies]
libc.workspace = true
bollard.workspace = true
constcat = "0.6.0"

[dependencies.tokio]
workspace = true
features = ["fs", "io-std", "rt", "rt-multi-thread"]

[dependencies.daemon_common]
workspace = true
features = ["docker"]
