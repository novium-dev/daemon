[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
authors = ["Markus Probst <markustieger@gmail.com>"]
license = "AGPL-3.0-only"

[package.metadata.deb]
name = "novium-daemon"
depends = ["novium-daemon-mariadb-plugin", "adduser (>=3.40)", "docker.io | docker-ce", "vim", "liblzma5", "init-system-helpers"]
conflicts = "novium_daemon_trace"
assets = [["target/release/daemon", "/usr/bin/novium_daemon", "755"]]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "novium_daemon", enable = false }
section = "admin"

[package.metadata.deb.variants.trace]
name = "novium-daemon-trace"
conflicts = "novium_daemon"
features = ["trace_sync"]

[features]
ssl = []
ssh = ["russh", "daemon_common/ssh"]
ssh_control = ["ssh"]
ssh_debug_auth_bypass = ["ssh"]
sftp = ["ssh", "russh-sftp"]
database = []
user_debug_auth_bypass = ["user"]
btrfs = ["daemon_common/btrfs"]
user = ["axum/ws", "daemon_common/user"]
sentry = ["dep:sentry"]

default = ["ssl", "ssh", "sftp", "ssh_control", "database", "user", "sentry", "btrfs"]
full = ["default"]
full_bypass = ["full", "ssh_debug_auth_bypass", "user_debug_auth_bypass"]
trace_sync = []

[dependencies]
libc.workspace = true
bollard.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
rustls.workspace = true
axum-server.workspace = true
axum.workspace = true
tower-http.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
regex.workspace = true
rand.workspace = true
signal-hook.workspace = true
termion.workspace = true
pkcs8.workspace = true
ed25519-dalek.workspace = true
chrono.workspace = true
utoipa.workspace = true
async-trait.workspace = true
sqlx.workspace = true
hex.workspace = true
tokio-util.workspace = true
serde_yaml.workspace = true
indexmap.workspace = true
futures-util.workspace = true
futures.workspace = true

sysinfo = "0.33.1"
inquire = "0.7.5"
num-traits = "0.2.19"
ringbuffer = "0.15.0"
utoipa-axum = "0.2.0"
fs_extra = "1.3.0"
xattr = "1.5.0"
bytes.workspace = true
cron = "0.15.0"

[target.'cfg(target_os = "linux")'.dependencies]
capctl = "0.2.4"

[dependencies.anyhow]
version = "1.0.97"
features = ["std"]

[dependencies.sentry]
workspace = true
optional = true

[dependencies.utoipa-swagger-ui]
version = "9.0.0"
features = ["axum"]

[dependencies.cap-async-std]
version = "3.4.2"
features = ["tokio1"]

[dependencies.async-std]
version = "1.13.0"
features = ["tokio1"]

[dependencies.daemon_common]
workspace = true
features = ["docker"]

[dependencies.tar]
version = "0.4.44"

[dependencies.reqwest]
workspace = true

[dependencies.url]
workspace = true
features = ["serde"]

[dependencies.russh]
version = "0.51.1"
optional = true

[dependencies.russh-sftp]
version = "2.0.8"
optional = true

[dependencies.ratatui]
version = "0.29.0"
features = ["crossterm"]

[dependencies.crossterm]
version = "0.28.1"
features = ["event-stream", "events"]

[dependencies.rustix]
version = "1.0.2"
features = ["thread"]

[dependencies.zstd]
version = "0.13.3"
features = []

[dependencies.flate2]
version = "1.1.0"
features = ["zlib"]

[dependencies.bzip2]
version = "0.5.2"

[dependencies.liblzma]
version = "0.3.6"
features = []

[dependencies.lz4]
version = "1.28.1"

[build-dependencies]
bindgen = "0.71.1"


