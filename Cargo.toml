[workspace]
members = [
    "services/backend/api",
    "services/backend/core",
    "services/backend/auth",
    "services/backend/http",
    "services/backend/minecraft",
    "services/backend/dev",
    "services/backend/bootstrap",
    "services/daemon/common",
    "services/daemon/sdk",
    "services/daemon",
    "services/daemon_mariadb_plugin",
    "services/billing",
    "services/bot",
]
resolver = "2"

[workspace.dependencies]
libc = "0.2"
bollard = "0.18.0"
regex = "1.11.0"
toml = "0.8.19"
rustls = "0.23.20"
tower-layer = "0.3.3"
base64 = "0.22.1"
axum-macros = "0.4.2"
rand = "0.8.5"
signal-hook = "0.3.17"
openssl = "0.10.66"
termion = "4.0.3"
http = "1.2.0"
async-trait = "0.1.83"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
dotenvy = "0.15.7"
indexmap = "2.7.0"
linkme = "0.3.31"
url = "2.5.4"
hex = "0.4.3"
argon2 = "0.6.0-pre.1"
serde_yaml = "0.9.34+deprecated"
java-properties = "2.0.0"
bigdecimal = "0.4.7"
scoped-futures = "0.1.4"

[workspace.dependencies.daemon_common]
path = "services/daemon/common"

[workspace.dependencies.daemon_sdk]
path = "services/daemon/sdk"

[workspace.dependencies.backend_api]
path = "services/backend/api"

[workspace.dependencies.reqwest]
version = "0.12.11"
default-features = false
features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "json",
    "rustls-tls",
    "rustls-tls-webpki-roots",
]

[workspace.dependencies.sentry]
# Currently there is no axum 0.8.0 support for sentry
git = "https://github.com/MarkusTieger/sentry-rust.git"
default-features = false
features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "rustls",
    "log",
    "tower",
    "tower-axum-matched-path",
    "tracing",
]

[workspace.dependencies.bitflags]
version = "2.6.0"
features = ["serde"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[workspace.dependencies.speedy]
version = "0.8.7"
features = ["speedy-derive", "indexmap"]

[workspace.dependencies.redis]
version = "0.27.5"
features = ["tokio"]

[workspace.dependencies.tokio]
version = "1.42.0"
features = ["full"]

[workspace.dependencies.tokio-util]
version = "0.7.12"
features = ["io-util"]

[workspace.dependencies.axum-server]
version = "0.7.1"
features = ["tls-rustls"]

[workspace.dependencies.axum]
version = "0.8.0-rc.1"
features = ["json", "macros", "http2"]

[workspace.dependencies.axum-extra]
version = "0.9.6"
features = ["cookie", "typed-header"]

[workspace.dependencies.axum-auth]
# Currently there is no axum 0.8.0 support for axum-auth
git = "https://github.com/MarkusTieger/axum-auth.git"

[workspace.dependencies.utoipa]
# Currently there is no axum 0.8.0 support for utoipa
git = "https://github.com/MarkusTieger/utoipa.git"
features = ["macros", "preserve_path_order"]

[workspace.dependencies.tower-http]
version = "0.6.1"
features = ["cors", "auth", "trace"]

[workspace.dependencies.sqlx]
version = "0.8.2"
features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "json",
    "mysql",
    "chrono",
    "bigdecimal",
]

[workspace.dependencies.chrono]
version = "0.4.38"
features = ["serde"]

[workspace.dependencies.uuid]
version = "1.10.0"
features = ["serde", "v4"]

[workspace.dependencies.pkcs8]
version = "0.11.0-rc.1"
features = ["pem"]

[workspace.dependencies.ed25519-dalek]
version = "2.1.1"
features = ["serde", "rand_core", "pkcs8", "pem"]
