[package]
name = "NeumatixDaemon"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
futures-util = "0.3.30"

[dependencies.tokio]
version = "1.38.0"
features = ["full"]

[dependencies.axum]
version = "0.7.5"
features = ["ws", "json"]

[dependencies.bollard]
version = "0.16.1"

[dependencies.diesel]
version = "2.2.1"
features = ["mysql"]

[dependencies.log]
version = "0.4.22"

[dependencies.futures]
version = "0.3.30"
features = []

[dependencies.btrfsutil]
version = "0.2.0"

[dependencies.uuid]
version = "1.9.1"
features = ["v4"]

[dependencies.tar]
version = "0.4.41"

[dependencies.bytes]
version = "1.6.0"

[dependencies.termion]
version = "4.0.2"