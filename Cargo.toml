[workspace]
members = ["backend", "daemon/common", "daemon/sdk", "daemon", "mariadb-plugin"]
resolver = "2"

[workspace.dependencies]
libc = "0.2.159"
bollard = "0.17.1"
serde_json = "1.0"
regex = "1.11.0"
toml = "0.8.19"
rustls = "0.23.14"
tower-layer = "0.3.3"
axum-auth = "0.7.0"
log = "0.4.22"
base64 = "0.22.1"
axum-macros = "0.4.2"
rand = "0.8.5"
env_logger = "0.11.5"
signal-hook = "0.3.17"
openssl = "0.10.66"
termion = "4.0.3"
http = "1.1.0"
async-trait = "0.1.83"
tracing = "*"
tracing-subscriber = "*"

[workspace.dependencies.daemon_common]
path = "daemon/common"

[workspace.dependencies.daemon_sdk]
path = "daemon/sdk"

[workspace.dependencies.reqwest]
version = "0.12.8"
features = ["json"]

[workspace.dependencies.bitflags]
version = "2.6.0"
features = ["serde"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.tokio]
version = "1.39.2"
features = ["full"]

[workspace.dependencies.axum-server]
version = "0.7.1"
features = ["tls-rustls"]

[workspace.dependencies.axum]
version = "0.7.7"
features = ["json", "macros"]

[workspace.dependencies.axum-extra]
version = "0.9.4"
features = ["cookie"]

[workspace.dependencies.tower-http]
version = "0.6.1"
features = ["cors", "auth", "trace"]

[workspace.dependencies.diesel-async]
version = "0.5.0"
features = ["mysql", "r2d2", "bb8"]

[workspace.dependencies.diesel]
version = "2.2.4"
features = ["mysql", "r2d2", "uuid", "chrono", "serde_json"]

[workspace.dependencies.chrono]
version = "0.4.38"
features = ["serde"]

[workspace.dependencies.uuid]
version = "1.10.0"
features = ["serde", "v4"]

[workspace.dependencies.pkcs8]
version = "0.11.0-rc.1"
features = ["pem"]

[workspace.dependencies.ed25519-dalek]
version = "2.1.1"
features = ["serde", "rand_core", "pkcs8", "pem"]
