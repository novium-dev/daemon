[workspace]
members = [
    "backend/*",
    "daemon/*",
    "daemon/framework/macros"
]
resolver = "3"

[workspace.dependencies]
libc = "0.2"
bollard = "0.19.0"
regex = "1.11.1"
toml = "0.8.22"
base64 = "0.22.1"
rand = "0.9.1"
signal-hook = "0.3.18"
termion = "4.0.5"
http = "1.3.1"
async-trait = "0.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
linkme = "0.3.33"
hex = "0.4.3"
argon2 = "0.5.3"
serde_yaml = "0.9.34+deprecated"
java-properties = "2.0.0"
futures = "0.3.31"
futures-core = "0.3.31"
anyhow = "1.0.98"
lazy_static = "1.5.0"
bytes = "1.10.1"
duplicate = "2.0.0"
futures-util = "0.3.31"
arrayvec = "0.7.6"
either = "1.15.0"
tower-layer = "0.3.3"
paste = "1.0.15"
no-panic = "0.1.35"
itertools = "0.14.0"
arc-swap = "1.7.1"
thiserror = "2.0.12"

[workspace.dependencies.daemon_common]
path = "daemon/common"
default-features = false

[workspace.dependencies.daemon_framework]
path = "daemon/framework"

[workspace.dependencies.daemon_framework_macros]
path = "daemon/framework/macros"

[workspace.dependencies.backend]
path = "backend/core"

[workspace.dependencies.rustls]
version = "0.23.27"
#default-features = false
#features = [
#  "ring",
#  "logging",
#  "std",
#  "tls12"
#]

[workspace.dependencies.tokio-rustls]
version = "0.26.2"
#default-features = false
#features = ["ring", "tls12", "logging"]

[workspace.dependencies.reqwest]
git = "https://github.com/MarkusTieger/reqwest.git"
branch = "testing"
default-features = false
features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "json",
    "rustls-tls-webpki-roots-no-provider",
    "stream"
]

[workspace.dependencies.sentry]
version = "0.38.1"
default-features = false
features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "rustls",
    "log",
    "tower",
    "tower-axum-matched-path",
    "tracing",
    "reqwest",
]


[workspace.dependencies.cron]
version = "0.15.0"
features = ["serde"]

[workspace.dependencies.chrono-tz]
version = "0.10.3"
features = ["serde"]

[workspace.dependencies.bitflags]
version = "2.9.1"
features = ["serde"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[workspace.dependencies.speedy]
version = "0.8.7"
features = ["speedy-derive", "indexmap_v2"]

[workspace.dependencies.redis]
version = "0.31.0"
default-features = false
features = [
    "uuid",
    "json",
    "tls-rustls",
    "tls-rustls-webpki-roots",
    "tokio-rustls-comp",
    "connection-manager",
]

[workspace.dependencies.tokio]
version = "1.45.1"

[workspace.dependencies.tokio-util]
version = "0.7.15"

[workspace.dependencies.axum-server]
version = "0.7.2"
features = ["tls-rustls"] # "tls-rustls-no-provider"

[workspace.dependencies.axum]
version = "0.8.4"
features = ["json", "macros", "http2", "ws"]

[workspace.dependencies.axum-extra]
version = "0.10.1"
features = ["cookie", "typed-header"]

[workspace.dependencies.axum-auth]
version = "0.8.1"

[workspace.dependencies.clap]
version = "4.5.39"
features = ["color", "env", "cargo"]

[workspace.dependencies.utoipa]
version = "5.3.1"
features = ["macros", "preserve_path_order"]

[workspace.dependencies.utoipa-axum]
version = "0.2.0"

[workspace.dependencies.tower]
version = "0.5.2"
features = ["full"]

[workspace.dependencies.hyper]
version = "1.6.0"
features = ["full"]

[workspace.dependencies.tower-http]
version = "0.6.4"
features = ["cors", "auth", "trace"]

[workspace.dependencies.sqlx]
version = "0.8.6"
features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs", # tls-rustls-ring
    "json",
    "mysql",
    "chrono",
    "bigdecimal",
    "uuid",
]

[workspace.dependencies.chrono]
version = "0.4.41"
features = ["serde"]

[workspace.dependencies.uuid]
version = "1.17.0"
features = ["serde", "v4"]

[workspace.dependencies.pkcs8]
version = "0.10.2"
features = ["pem"]

[workspace.dependencies.ed25519-dalek]
version = "2.1.1"
features = ["serde", "rand_core", "pkcs8", "pem"]

# No axum 0.8 support yet without git
[workspace.dependencies.tonic]
git = "https://github.com/MarkusTieger/tonic.git"

[workspace.dependencies.tonic-build]
git = "https://github.com/MarkusTieger/tonic.git"

[workspace.dependencies.tonic-web]
git = "https://github.com/MarkusTieger/tonic.git"
features = ["axum"]

[workspace.dependencies.prost]
version = "0.13.5"

[workspace.dependencies.url]
version = "2.5.4"
features = ["serde"]

[workspace.dependencies.indexmap]
version = "2.9.0"
features = ["serde"]

[workspace.dependencies.rcgen]
version = "0.13.2"
default-features = false
features = ["crypto", "pem", "x509-parser", "aws_lc_rs"]

[profile.dev.package.sqlx-macros]
opt-level = 3
