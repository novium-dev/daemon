[workspace]
members = [
    "backend/api",
    "backend/core",
    "backend/auth",
    "backend/http",
    "backend/grpc",
    "backend/bot",
    "backend/minecraft",
    "backend/generic",
    "backend/dev",
    "backend/bootstrap",
    "daemon/common",
    "daemon/sdk",
    "daemon",
    #"daemon/mariadb_plugin",
]
resolver = "2"

[workspace.dependencies]
libc = "0.2"
bollard = "0.18.1"
regex = "1.11.1"
toml = "0.8.20"
base64 = "0.22.1"
rand = "0.9.0"
signal-hook = "0.3.17"
termion = "4.0.3"
http = "1.2.0"
async-trait = "0.1.86"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
indexmap = "2.7.1"
linkme = "0.3.31"
hex = "0.4.3"
argon2 = "0.6.0-pre.1"
serde_yaml = "0.9.34+deprecated"
java-properties = "2.0.0"
scoped-futures = "0.1.4"
futures = "0.3.31"
futures-core = "0.3.31"
anyhow = "1.0.95"
lazy_static = "1.5.0"
bytes = "1.9.0"
duplicate = "2.0.0"
futures-util = "0.3.31"
arrayvec = "0.7.6"

[workspace.dependencies.daemon_common]
path = "daemon/common"

[workspace.dependencies.daemon_sdk]
path = "daemon/sdk"

[workspace.dependencies.backend_api]
path = "backend/api"

[workspace.dependencies.rustls]
version = "0.23.23"

[workspace.dependencies.reqwest]
version = "0.12.12"
default-features = false
features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "json",
    "rustls-tls",
    "rustls-tls-webpki-roots",
]

[workspace.dependencies.sentry]
version = "0.36.0"
default-features = false
features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "rustls",
    "log",
    "tower",
    "tower-axum-matched-path",
    "tracing",
    "reqwest",
]

[workspace.dependencies.bitflags]
version = "2.8.0"
features = ["serde"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[workspace.dependencies.speedy]
version = "0.8.7"
features = ["speedy-derive", "indexmap_v2"]

[workspace.dependencies.redis]
version = "0.29.0"
default-features = false
features = [
    "uuid",
    "json",
    "tls-rustls",
    "tls-rustls-webpki-roots",
    "tokio-rustls-comp",
]

[workspace.dependencies.tokio]
version = "1.43.0"
features = ["full"]

[workspace.dependencies.tokio-util]
version = "0.7.13"
features = ["io-util"]

[workspace.dependencies.axum-server]
version = "0.7.1"
features = ["tls-rustls"]

[workspace.dependencies.axum]
version = "0.8.1"
features = ["json", "macros", "http2"]

[workspace.dependencies.axum-extra]
version = "0.10.0"
features = ["cookie", "typed-header"]

[workspace.dependencies.axum-auth]
version = "0.8.1"

[workspace.dependencies.utoipa]
version = "5.3.1"
features = ["macros", "preserve_path_order"]

[workspace.dependencies.tower]
version = "0.5.2"
features = ["full"]

[workspace.dependencies.hyper]
version = "1.6.0"
features = ["full"]

[workspace.dependencies.tower-http]
version = "0.6.2"
features = ["cors", "auth", "trace"]

[workspace.dependencies.sqlx]
version = "0.8.3"
features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "json",
    "mysql",
    "chrono",
    "bigdecimal",
]

[workspace.dependencies.chrono]
version = "0.4.39"
features = ["serde"]

[workspace.dependencies.uuid]
version = "1.13.2"
features = ["serde", "v4"]

[workspace.dependencies.pkcs8]
version = "0.11.0-rc.2"
features = ["pem"]

[workspace.dependencies.ed25519-dalek]
version = "2.1.1"
features = ["serde", "rand_core", "pkcs8", "pem"]

# No axum 0.8 support yet without git
[workspace.dependencies.tonic]
git = "https://github.com/MarkusTieger/tonic.git"

[workspace.dependencies.tonic-build]
git = "https://github.com/MarkusTieger/tonic.git"

[workspace.dependencies.tonic-web]
git = "https://github.com/MarkusTieger/tonic.git"
features = ["axum"]

[workspace.dependencies.prost]
version = "0.13.5"

[workspace.dependencies.url]
version = "2.5.4"
features = ["serde"]

[profile.dev.package.sqlx-macros]
opt-level = 3
