[package]
name = "nm-daemon"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix = "0.13.1"
actix-cors = "0.6.5"
actix-multipart = "0.6.1"
actix-rt = "2.9.0"
actix-web = "4.4.1"
actix-ws = "0.2.5"
actix-web-actors = "4.2.0"
actix-http = "3.5.1"
actix-web-httpauth = "0.8.1"
lazy_static = "1.4.0"

bollard = "0.15.0"
dotenvy = "0.15.7"
env_logger = "0.10.1"
log = "0.4.20"
uuid = { version = "1.6.1", features = ["fast-rng"]}

tokio = "1.35.1"
tokio-stream = "0.1.14"
serde_json = "1.0.108"
serde = { version = "1.0.193", features = ["derive"] }

redis = "0.24.0"