[workspace]
members = [
    "services/backend",
    "services/daemon/common",
    "services/daemon/sdk",
    "services/daemon",
    "services/daemon_mariadb_plugin",
    "services/billing",
    "services/bot",
]
resolver = "2"

[workspace.dependencies]
libc = "0.2"
bollard = "0.18.0"
regex = "1.11.0"
toml = "0.8.19"
rustls = "0.23.14"
tower-layer = "0.3.3"
axum-auth = "0.7.0"
base64 = "0.22.1"
axum-macros = "0.4.2"
rand = "0.8.5"
signal-hook = "0.3.17"
openssl = "0.10.66"
termion = "4.0.3"
http = "1.1.0"
async-trait = "0.1.83"
tracing = "*"
tracing-subscriber = "*"
dotenvy = "*"

[workspace.dependencies.daemon_common]
path = "services/daemon/common"

[workspace.dependencies.daemon_sdk]
path = "services/daemon/sdk"

[workspace.dependencies.reqwest]
version = "0.12.9"
default-features = false
features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "json",
    "rustls-tls",
    "rustls-tls-webpki-roots",
]

[workspace.dependencies.sentry]
version = "0.34.0"
default-features = false
features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "reqwest",
    "rustls",
    "log",
    "tower",
    "tower-axum-matched-path",
    "tracing",
]

[workspace.dependencies.bitflags]
version = "2.6.0"
features = ["serde"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[workspace.dependencies.tokio]
version = "1.41.1"
features = ["full"]

[workspace.dependencies.axum-server]
version = "0.7.1"
features = ["tls-rustls"]

[workspace.dependencies.axum]
version = "0.7.7"
features = ["json", "macros"]

[workspace.dependencies.utoipa]
version = "5.2.0"
features = ["macros", "preserve_path_order"]

[workspace.dependencies.tower-http]
version = "0.6.1"
features = ["cors", "auth", "trace"]

[workspace.dependencies.diesel-async]
version = "0.5.0"
features = ["mysql", "r2d2", "bb8"]

[workspace.dependencies.diesel]
version = "2.2.5"
features = ["mysql", "r2d2", "uuid", "chrono", "serde_json"]

[workspace.dependencies.chrono]
version = "0.4.38"
features = ["serde"]

[workspace.dependencies.uuid]
version = "1.10.0"
features = ["serde", "v4"]

[workspace.dependencies.pkcs8]
version = "0.11.0-rc.1"
features = ["pem"]

[workspace.dependencies.ed25519-dalek]
version = "2.1.1"
features = ["serde", "rand_core", "pkcs8", "pem"]
