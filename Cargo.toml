[workspace]
members = ["daemon", "daemon_common", "daemon_mariadb_plugin"]
resolver = "3"

[patch.crates-io]
reqwest.git = "https://github.com/0xIO32/reqwest.git"

[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
private_bounds = "allow"
deprecated = "warn"
nonstandard-style = "deny"
let-underscore = "allow"
refining-impl-trait = "deny"
keyword-idents = "deny"
future-incompatible = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

implicit_return = "allow"
field_scoped_visibility_modifiers = "allow"
single_call_fn = "allow"
question_mark_used = "allow"
mod_module_files = "allow"
self_named_module_files = "allow"
ref_patterns = "allow"
pattern_type_mismatch = "allow"
iter_over_hash_type = "allow"
inline_always = "allow"
absolute_paths = "allow"
std_instead_of_alloc = "allow"
used_underscore_binding = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
partial_pub_fields = "allow"
pub_use = "allow"
single_char_lifetime_names = "allow"
use_debug = "allow"
needless_raw_strings = "allow"
arbitrary_source_item_ordering = "allow"
module_name_repetitions = "allow"
wildcard_imports = "allow"
impl_trait_in_params = "allow"
float_arithmetic = "allow"
single_match_else = "allow"
missing-assert-message = "allow"

significant_drop_in_scrutinee = "forbid"

renamed_function_params = "allow"

# only deny instead of forbid because of autogenerated code
min_ident_chars = "deny"

# Horror with match on ErrorKind
wildcard_enum_match_arm = "allow"

let_underscore_must_use = "allow"
let_underscore_untyped = "allow"

todo = "warn"
unimplemented = "allow"

shadow_reuse = "allow"
shadow_unrelated = "allow"

pub_with_shorthand = "allow"
pub_without_shorthand = "forbid"

unseparated_literal_suffix = "allow"
separated_literal_suffix = "forbid"

semicolon_inside_block = "allow"
semicolon_outside_block = "deny"

# For now, deny later
missing_docs_in_private_items = "allow"
allow_attributes_without_reason = "allow"
too_many_lines = "allow"
unwrap_in_result = "allow"
expect_used = "allow"
as_conversions = "allow"
cast_possible_truncation = "allow"
cognitive_complexity = "allow"
multiple_inherent_impl = "allow"
# Caused by the tokio select macro, remove after fixed
integer_division_remainder_used = "allow"
redundant_pub_crate = "allow"

# For now, deny later, DOC
missing_errors_doc = "allow"
missing_panics_doc = "allow"


# Restriction
allow_attributes = "deny"
arithmetic_side_effects = "deny"
as_pointer_underscore = "deny"
assertions_on_result_states = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
default_numeric_fallback = "deny"
default_union_representation = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
else_if_without_else = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"

# Should never be part of the code
exit = "forbid"

filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
inline_asm_x86_att_syntax = "deny"
inline_asm_x86_intel_syntax = "deny"
integer_division = "deny"
large_include_file = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "deny"
mixed_read_write_in_expression = "forbid"
modulo_arithmetic = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
non_ascii_literal = "deny"
non_zero_suggestions = "deny"
panic = "deny"
panic_in_result_fn = "deny"
pathbuf_init_then_push = "deny"
# pointer_format = "deny" # Not found by clippy?
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "forbid"
rc_mutex = "forbid"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
shadow_same = "deny"
std_instead_of_core = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
implicit_clone = "forbid"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "allow"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
alloc_instead_of_core = "deny"


big_endian_bytes = "deny"
host_endian_bytes = "deny"
little_endian_bytes = "deny"


[workspace.dependencies]
bollard = "0.21.0"
libc = "0.2"
toml = "1.1.2"
base64 = "0.22.1"
rand_core = "0.10.0"
rand = "0.10.0"
chacha20 = "0.10.0"
signal-hook = "0.4.4"
termion = "4.0.6"
http = "1.4.0"
async-trait = "0.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
hex = "0.4.3"
java-properties = "2.0.0"
futures = "0.3.32"
anyhow = "1.0.102"
bytes = "1.11.1"
futures-util = "0.3.32"
either = "1.15.0"
tower-layer = "0.3.3"
pastey = "0.2.1"
itertools = "0.14.0"
arc-swap = "1.9.1"
thiserror = "2.0.18"
lazy-regex = "3.6.0"

[workspace.dependencies.daemon_common]
path = "daemon_common"
default-features = false

[workspace.dependencies.zelus]
git = "https://github.com/0xIO32/zelus.git"
default-features = false
features = ["error", "sqlx", "io"]

[workspace.dependencies.rustls]
version = "0.23.37"
#default-features = false
#features = [
#  "ring",
#  "logging",
#  "std",
#  "tls12"
#]

[workspace.dependencies.tokio-rustls]
version = "0.26.4"
#default-features = false
#features = ["ring", "tls12", "logging"]

[workspace.dependencies.reqwest]
git = "https://github.com/0xIO32/reqwest.git"
features = ["http2", "json", "stream", "zstd"]

[workspace.dependencies.sentry]
version = "0.48.1"
default-features = false
features = [
	"backtrace",
	"contexts",
	"debug-images",
	"panic",
	"rustls",
	"log",
	"tower",
	"tower-axum-matched-path",
	"tracing",
	"reqwest",
]


[workspace.dependencies.cron]
version = "0.16.0"
features = ["serde"]

[workspace.dependencies.chrono-tz]
version = "0.10.4"
features = ["serde"]

[workspace.dependencies.bitflags]
version = "2.11.0"
features = ["serde"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[workspace.dependencies.tokio]
version = "1.51.0"

[workspace.dependencies.tokio-util]
version = "0.7.18"

[workspace.dependencies.axum-server]
version = "0.8.0"
features = ["tls-rustls"]

[workspace.dependencies.axum]
version = "0.8.8"
features = ["json", "macros", "http2", "ws"]

[workspace.dependencies.axum-extra]
version = "0.12.5"
features = ["cookie", "typed-header"]

[workspace.dependencies.clap]
version = "4.6.0"
features = ["color", "env", "cargo"]

[workspace.dependencies.utoipa]
version = "5.4.0"
features = ["macros", "preserve_path_order", "url"]

[workspace.dependencies.utoipa-axum]
version = "0.2.0"

[workspace.dependencies.tower]
version = "0.5.3"
features = ["full"]

[workspace.dependencies.tower-http]
version = "0.6.8"
features = [
	"cors",
	"auth",
	"trace",
	"compression-zstd",
	"compression-br",
	"compression-gzip",
]

[workspace.dependencies.sqlx]
version = "0.8.6"
features = [
	"runtime-tokio",
	"tls-rustls-aws-lc-rs",
	"json",
	"mysql",
	"chrono",
	"bigdecimal",
	"uuid",
]

[workspace.dependencies.chrono]
version = "0.4.44"
features = ["serde"]

[workspace.dependencies.uuid]
version = "1.23.0"
features = ["serde", "v4"]

[workspace.dependencies.pkcs8]
version = "0.11.0-rc.11"
features = ["pem", "std"]

[workspace.dependencies.ed25519-dalek]
version = "3.0.0-pre.6"
features = ["serde", "rand_core", "pkcs8", "pem"]

[workspace.dependencies.url]
version = "2.5.8"
features = ["serde"]

[workspace.dependencies.indexmap]
version = "2.13.1"
features = ["serde"]

[workspace.dependencies.rcgen]
# See https://github.com/rustls/rcgen/issues/400
version = "=0.14.7"
default-features = false
features = ["crypto", "pem", "x509-parser", "aws_lc_rs"]

[workspace.dependencies.serde_yaml_ng]
git = "https://github.com/acatton/serde-yaml-ng"
rev = "3628102977f3ec9e02b95ef32fcec30b3df91390"

[profile.dev.package.sqlx-macros]
opt-level = 3
