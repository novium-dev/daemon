[package]
name = "NeumatixDaemon"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.208", features = ["derive"] }
futures-util = "0.3.30"
env_logger = "0.11.3"
rand = "0.8.5"
libc = "0.2.155"

[dependencies.tokio]
version = "1.38.0"
features = ["full"]

[dependencies.axum]
version = "0.7.5"
features = ["ws", "json"]

[dependencies.tower-http]
version = "0.5.2"
features = ["cors", "auth"]

[dependencies.tower-layer]
version = "0.3.2"

[dependencies.axum-auth]
version = "0.7.0"

[dependencies.base64]
version = "0.22.1"

[dependencies.bollard]
version = "0.16.1"

[dependencies.diesel]
version = "2.2.1"
features = ["mysql"]

[dependencies.log]
version = "0.4.22"

[dependencies.futures]
version = "0.3.30"
features = []

[dependencies.btrfsutil]
version = "0.2.0"

[dependencies.tar]
version = "0.4.41"

[dependencies.bytes]
version = "1.6.0"

[dependencies.termion]
version = "4.0.2"

[dependencies.ed25519-dalek]
version = "2.1.1"
features = ["serde", "rand_core"]

[dependencies.russh]
version = "0.43.0"

[dependencies.russh-sftp]
version = "2.0.1"

[dependencies.russh-keys]
version = "0.43.0"
